apiVersion: v1
kind: ConfigMap
metadata:
  name: kguard-ai-config
  namespace: k-guard
data:
  SERVER_PORT: "8080"
  KGUARD_AI_BACKEND_ENABLED: "true"
  KGUARD_AI_BACKEND_URL: "http://k-guard-service.k-guard.svc.cluster.local:8000"
  KGUARD_AI_BACKEND_EVENTS_PATH: "/api/security/events"
  KGUARD_AI_LLM_ENABLED: "false"
  KGUARD_AI_LLM_PROVIDER: "ollama"
  KGUARD_AI_LLM_BASE_URL: "http://ollama-service.k-guard.svc.cluster.local:11434"
  KGUARD_AI_LLM_MODEL: "qwen3:0.6b"
  KGUARD_AI_LLM_TIMEOUT_SECONDS: "30"
  KGUARD_AI_ELASTICSEARCH_EXPORT_ENABLED: "false"
  KGUARD_AI_ELASTICSEARCH_URL: "http://elasticsearch.k-guard.svc.cluster.local:9200"
  KGUARD_AI_ELASTICSEARCH_INDEX: "kguard-ai-alerts"
