apiVersion: v1
kind: ConfigMap
metadata:
  name: kguard-ai-config
  labels:
    app: kguard-ai
    app.kubernetes.io/name: kguard-ai
    app.kubernetes.io/part-of: k-guard
data:
  SERVER_PORT: "8080"
  SPRING_PROFILES_ACTIVE: "kubernetes"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED: "true"
  MANAGEMENT_HEALTH_READINESSSTATE_ENABLED: "true"
  OLLAMA_ENABLED: "false"
  OLLAMA_BASE_URL: "http://ollama.k-guard.svc.cluster.local:11434"
  ELASTICSEARCH_ENABLED: "false"
  ELASTICSEARCH_URL: "http://elasticsearch.k-guard.svc.cluster.local:9200"
