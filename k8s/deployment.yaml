apiVersion: apps/v1
kind: Deployment
metadata:
  name: kguard-ai
  labels:
    app: kguard-ai
    app.kubernetes.io/name: kguard-ai
    app.kubernetes.io/part-of: k-guard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kguard-ai
  template:
    metadata:
      labels:
        app: kguard-ai
        app.kubernetes.io/name: kguard-ai
        app.kubernetes.io/part-of: k-guard
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kguard-ai
          image: ghcr.io/kamouloxpelvis/k-guard-ai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: kguard-ai-config
            - secretRef:
                name: kguard-ai-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
