name: Publish Docker image

on:
  push:
    branches:
      - main
      - feat/v0.5.0-provider-es-k8s
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kamouloxpelvis/k-guard-ai

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update K8s manifest with new image tag
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          NEW_TAG="${IMAGE_TAG}"

          DEPLOY_FILE="infrastructure/apps/k-guard-ai/k8s/deployment.yaml"

          if [ ! -f "$DEPLOY_FILE" ]; then
            echo "Deployment file not found: $DEPLOY_FILE"
            exit 0
          fi

          sed -i "s|image: ${REGISTRY}/${IMAGE_NAME}:.*|image: ${REGISTRY}/${IMAGE_NAME}:${NEW_TAG}|" "$DEPLOY_FILE"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add "$DEPLOY_FILE"
          git diff --cached --quiet || git commit -m "Update K-Guard AI image tag to ${NEW_TAG}"
          git push